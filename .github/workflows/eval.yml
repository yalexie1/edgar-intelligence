name: Eval-Gated Regression Check

# Deliberately NOT run on every push/PR — each run calls the real OpenAI,
# Anthropic, Pinecone, and (optionally) Cohere APIs across the 110-case golden
# set, which costs real money. Scoped to merge-to-main and manual dispatch only.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  # Current golden-set baseline (see CLAUDE.md / DEVLOG.md, 2026-07-10): 107/110
  # (~97.3%). Fails the build if a change drops the pass rate below this floor.
  MIN_PASS_RATE: "0.97"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          nohup uvicorn api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is up."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time." >&2
          cat api.log
          exit 1

      - name: Run golden-set eval
        run: python evals/eval.py --url http://127.0.0.1:8000

      - name: Enforce pass-rate floor
        run: |
          python - <<'PYEOF'
          import json, os, sys

          summary = json.load(open("evals/last_results.json"))["summary"]
          pass_rate = summary["pass_rate"]
          floor = float(os.environ["MIN_PASS_RATE"])

          print(f"Pass rate: {pass_rate:.1%} (floor: {floor:.0%})")
          if pass_rate < floor:
              print(f"FAIL: pass rate {pass_rate:.1%} is below the {floor:.0%} floor.")
              sys.exit(1)
          print("OK: pass rate meets the floor.")
          PYEOF

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/last_results.json
